<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700');

      /* Base styles */
      .bg {
        fill: #0B0F19;
      }
      .grid {
        fill: url(#grid-pattern);
      }

      /* Section Header */
      .header-title {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.25em;
        fill: #94A3B8;
        text-anchor: middle;
      }

      /* Box Header and Skills Typography */
      .box-title {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-anchor: middle;
      }

      .skill-text {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: #94A3B8;
        text-anchor: middle;
      }

      .skill-header-gold { fill: #E5B869; }
      .skill-header-silver { fill: #CBD5E1; }
      .skill-header-blue { fill: #3B82F6; }
      .skill-header-rose { fill: #F43F5E; }

      /* Floating animations for boxes */
      .box-group-1 { animation: floatBox1 6s ease-in-out infinite; }
      .box-group-2 { animation: floatBox2 5.2s ease-in-out infinite; }
      .box-group-3 { animation: floatBox3 6.4s ease-in-out infinite; }
      .box-group-4 { animation: floatBox4 5.6s ease-in-out infinite; }

      @keyframes floatBox1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes floatBox2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes floatBox3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      @keyframes floatBox4 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    </style>

    <!-- Isometric Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 20 M 0 0 L 40 20" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" rx="12"/>
  <rect class="grid" width="100%" height="100%" rx="12"/>

  <!-- Section Header -->
  <text x="400" y="28" class="header-title">TECH STACK &amp; CAPABILITIES</text>
  <line x1="310" y1="38" x2="490" y2="38" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />

  <!-- COLUMN 1: LANGUAGES (Gold) -->
  <g class="box-group-1" transform="translate(0, 0)">
    <!-- 3D Base Bevel -->
    <rect x="40" y="58" width="155" height="190" rx="8" fill="#785925" />
    <!-- Main Box Face -->
    <rect x="40" y="55" width="155" height="190" rx="8" fill="#0E131F" stroke="rgba(229, 184, 105, 0.4)" stroke-width="1.2" />
    
    <text x="117.5" y="80" class="box-title skill-header-gold">LANGUAGES</text>
    <line x1="60" y1="90" x2="175" y2="90" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
    
    <text x="117.5" y="112" class="skill-text">Python</text>
    <text x="117.5" y="132" class="skill-text">JavaScript (ES6+)</text>
    <text x="117.5" y="152" class="skill-text">PHP / SQL</text>
    <text x="117.5" y="172" class="skill-text">Java / C</text>
    
    <!-- Progress Indicator -->
    <rect x="57.5" y="210" width="120" height="5" rx="2.5" fill="#1E293B" />
    <rect x="57.5" y="210" width="105" height="5" rx="2.5" fill="#E5B869" />
  </g>

  <!-- COLUMN 2: WEB ENGINE (Silver) -->
  <g class="box-group-2" transform="translate(0, 0)">
    <!-- 3D Base Bevel -->
    <rect x="226" y="58" width="155" height="190" rx="8" fill="#334155" />
    <!-- Main Box Face -->
    <rect x="226" y="55" width="155" height="190" rx="8" fill="#0E131F" stroke="rgba(203, 213, 225, 0.4)" stroke-width="1.2" />
    
    <text x="303.5" y="80" class="box-title skill-header-silver">WEB &amp; APP</text>
    <line x1="246" y1="90" x2="361" y2="90" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
    
    <text x="303.5" y="112" class="skill-text">React / HTML5 / CSS3</text>
    <text x="303.5" y="132" class="skill-text">Node.js / Express</text>
    <text x="303.5" y="152" class="skill-text">Shopify Liquid</text>
    <text x="303.5" y="172" class="skill-text">WordPress / Custom PHP</text>
    
    <!-- Progress Indicator -->
    <rect x="243.5" y="210" width="120" height="5" rx="2.5" fill="#1E293B" />
    <rect x="243.5" y="210" width="95" height="5" rx="2.5" fill="#CBD5E1" />
  </g>

  <!-- COLUMN 3: DATA / AI (Blue) -->
  <g class="box-group-3" transform="translate(0, 0)">
    <!-- 3D Base Bevel -->
    <rect x="413" y="58" width="155" height="190" rx="8" fill="#1E3A8A" />
    <!-- Main Box Face -->
    <rect x="413" y="55" width="155" height="190" rx="8" fill="#0E131F" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.2" />
    
    <text x="490.5" y="80" class="box-title skill-header-blue">DATA / AI</text>
    <line x1="433" y1="90" x2="548" y2="90" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
    
    <text x="490.5" y="112" class="skill-text">Machine Learning Models</text>
    <text x="490.5" y="132" class="skill-text">Scikit-Learn</text>
    <text x="490.5" y="152" class="skill-text">NumPy / Pandas</text>
    <text x="490.5" y="172" class="skill-text">Prompt Engineering / APIs</text>
    
    <!-- Progress Indicator -->
    <rect x="430.5" y="210" width="120" height="5" rx="2.5" fill="#1E293B" />
    <rect x="430.5" y="210" width="90" height="5" rx="2.5" fill="#3B82F6" />
  </g>

  <!-- COLUMN 4: SYSTEMS (Rose) -->
  <g class="box-group-4" transform="translate(0, 0)">
    <!-- 3D Base Bevel -->
    <rect x="600" y="58" width="155" height="190" rx="8" fill="#4C0519" />
    <!-- Main Box Face -->
    <rect x="600" y="55" width="155" height="190" rx="8" fill="#0E131F" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.2" />
    
    <text x="677.5" y="80" class="box-title skill-header-rose">SYSTEMS</text>
    <line x1="620" y1="90" x2="735" y2="90" stroke="rgba(148, 163, 184, 0.1)" stroke-width="1" />
    
    <text x="677.5" y="112" class="skill-text">System Design &amp; Arch</text>
    <text x="677.5" y="132" class="skill-text">Data Structures &amp; Algo</text>
    <text x="677.5" y="152" class="skill-text">Relational DBMS</text>
    <text x="677.5" y="172" class="skill-text">Git / Linux / Jira</text>
    
    <!-- Progress Indicator -->
    <rect x="617.5" y="210" width="120" height="5" rx="2.5" fill="#1E293B" />
    <rect x="617.5" y="210" width="100" height="5" rx="2.5" fill="#F43F5E" />
  </g>
</svg>
