<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700');
      @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700');

      /* Base styles */
      .bg {
        fill: #0B0F19;
      }
      .grid {
        fill: url(#grid-pattern);
      }

      /* Section Header */
      .header-title {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.25em;
        fill: #94A3B8;
        text-anchor: middle;
      }

      /* Column typography */
      .col-title {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-anchor: middle;
      }
      .col-text {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: #94A3B8;
        text-anchor: middle;
      }
      .col-highlight {
        font-weight: 700;
        fill: #FFFFFF;
      }

      /* Divider lines */
      .divider {
        stroke: rgba(148, 163, 184, 0.08);
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      /* Muted elegant theme colors */
      .color-gold { fill: #E5B869; }
      .color-silver { fill: #CBD5E1; }
      .color-rose { fill: #F43F5E; }
      .color-emerald { fill: #10B981; }
      .color-blue { fill: #3B82F6; }
      .color-orange { fill: #F97316; }

      /* Floating animations for columns */
      .float-1 { animation: floatCol1 6s ease-in-out infinite; }
      .float-2 { animation: floatCol2 5s ease-in-out infinite; }
      .float-3 { animation: floatCol3 5.5s ease-in-out infinite; }
      .float-4 { animation: floatCol4 5.2s ease-in-out infinite; }
      .float-5 { animation: floatCol5 6.2s ease-in-out infinite; }
      .float-6 { animation: floatCol6 5.7s ease-in-out infinite; }

      @keyframes floatCol1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes floatCol2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes floatCol3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      @keyframes floatCol4 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      @keyframes floatCol5 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      @keyframes floatCol6 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    </style>

    <!-- Isometric Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 20 M 0 0 L 40 20" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect class="bg" width="100%" height="100%" rx="12" />
  <rect class="grid" width="100%" height="100%" rx="12" />

  <!-- Section Header -->
  <text x="400" y="24" class="header-title">PROFILE HIGHLIGHTS</text>
  <line x1="330" y1="32" x2="470" y2="32" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />

  <!-- High-Tech Divider Grid Lines -->
  <g>
    <!-- Vertical Dividers -->
    <line x1="266" y1="45" x2="266" y2="255" class="divider" />
    <line x1="533" y1="45" x2="533" y2="255" class="divider" />

    <!-- Horizontal Divider -->
    <line x1="40" y1="145" x2="760" y2="145" class="divider" stroke-dasharray="4, 4" />
  </g>

  <!-- ================= ROW 1 ================= -->

  <!-- COLUMN 1: E-COMMERCE (Gold) -->
  <g class="float-1">
    <!-- 3D Isometric Base Slab -->
    <path d="M 95 65 L 133 84 L 133 87 L 95 68 Z" fill="#785925" />
    <path d="M 133 84 L 171 65 L 171 68 L 133 87 Z" fill="#A17A38" />
    <path d="M 133 46 L 171 65 L 133 84 L 95 65 Z" fill="rgba(229, 184, 105, 0.08)" stroke="rgba(229, 184, 105, 0.4)" stroke-width="1.2" />

    <!-- 3D Isometric Shopping Bag -->
    <g transform="translate(-3, 6)">
      <path d="M 132 21 Q 133 13 136 13 Q 139 13 140 21" fill="none" stroke="#E5B869" stroke-width="1.2" />
      <path d="M 134 22 Q 135 16 136 16 Q 137 16 138 22" fill="none" stroke="#FFFFFF" stroke-width="1" />
      <path d="M 128 23 L 136 27 L 136 37 L 128 33 Z" fill="#C59E59" stroke="#785925" stroke-width="0.8" />
      <path d="M 136 27 L 144 23 L 144 33 L 136 37 Z" fill="#E5B869" stroke="#A17A38" stroke-width="0.8" />
      <path d="M 136 19 L 144 23 L 136 27 L 128 23 Z" fill="#F3CE8A" stroke="#FFFFFF" stroke-width="0.8" />
    </g>

    <!-- Text -->
    <text x="133" y="105" class="col-title color-gold">E-COMMERCE</text>
    <text x="133" y="120" class="col-text col-highlight">Shopify &amp; WordPress</text>
    <text x="133" y="133" class="col-text">Liquid, Custom PHP</text>
  </g>

  <!-- COLUMN 2: AUTOMATION (Silver) -->
  <g class="float-2">
    <!-- 3D Isometric Base Slab -->
    <path d="M 362 65 L 400 84 L 400 87 L 362 68 Z" fill="#334155" />
    <path d="M 400 84 L 438 65 L 438 68 L 400 87 Z" fill="#475569" />
    <path d="M 400 46 L 438 65 L 400 84 L 362 65 Z" fill="rgba(203, 213, 225, 0.08)" stroke="rgba(203, 213, 225, 0.4)" stroke-width="1.2" />

    <!-- 3D Isometric Gear -->
    <g transform="translate(0, 6)">
      <path d="M 387 27.5 L 400 34 L 400 37.5 L 387 31 Z" fill="#64748B" />
      <path d="M 400 34 L 413 27.5 L 413 31 L 400 37.5 Z" fill="#94A3B8" />
      <g transform="translate(400, 27.5) scale(1, 0.5) rotate(45)">
        <circle cx="0" cy="0" r="13" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="1" />
        <circle cx="0" cy="0" r="6" fill="#0B0F19" stroke="#64748B" stroke-width="1" />
        <line x1="-13" y1="0" x2="13" y2="0" stroke="#475569" stroke-width="1.5" />
        <line x1="0" y1="-13" x2="0" y2="13" stroke="#475569" stroke-width="1.5" />
      </g>
    </g>

    <!-- Text -->
    <text x="400" y="105" class="col-title color-silver">AUTOMATION</text>
    <text x="400" y="120" class="col-text col-highlight">AI-Assisted Workflows</text>
    <text x="400" y="133" class="col-text">API &amp; Webhook Sync</text>
  </g>

  <!-- COLUMN 3: ACADEMICS (Rose) -->
  <g class="float-3">
    <!-- 3D Isometric Base Slab -->
    <path d="M 629 65 L 667 84 L 667 87 L 629 68 Z" fill="#4C0519" />
    <path d="M 667 84 L 705 65 L 705 68 L 667 87 Z" fill="#881337" />
    <path d="M 667 46 L 705 65 L 667 84 L 629 65 Z" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.2" />

    <!-- 3D Isometric Cap -->
    <g transform="translate(0, 7)">
      <path d="M 660 30 L 660 34 C 660 37, 674 37, 674 34 L 674 30 Z" fill="#881337" stroke="#4C0519" stroke-width="1" />
      <path d="M 667 20 L 679 26 L 667 32 L 655 26 Z" fill="#F43F5E" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M 667 26 L 677 29.5 L 677 35" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
      <circle cx="677" cy="35" r="0.8" fill="#FFFFFF" />
    </g>

    <!-- Text -->
    <text x="667" y="105" class="col-title color-rose">ACADEMICS</text>
    <text x="667" y="120" class="col-text col-highlight">B.Tech in ICT</text>
    <text x="667" y="133" class="col-text">Adani Uni (CGPA: 7.83)</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- COLUMN 4: DEVELOPMENT (Emerald) -->
  <g class="float-4">
    <!-- 3D Isometric Base Slab -->
    <path d="M 95 185 L 133 204 L 133 207 L 95 188 Z" fill="#065F46" />
    <path d="M 133 204 L 171 185 L 171 188 L 133 207 Z" fill="#047857" />
    <path d="M 133 166 L 171 185 L 133 204 L 95 185 Z" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" />

    <!-- 3D Isometric Terminal Block -->
    <g transform="translate(-7, 123)">
      <path d="M 132 28 L 140 32 L 140 38 L 132 34 Z" fill="#047857" stroke="#065F46" stroke-width="0.8" />
      <path d="M 140 32 L 148 28 L 148 34 L 140 38 Z" fill="#10B981" stroke="#065F46" stroke-width="0.8" />
      <path d="M 140 22 L 148 28 L 140 32 L 132 28 Z" fill="#34D399" stroke="#FFFFFF" stroke-width="0.8" />
      <path d="M 141 33 L 144 31 L 141 29" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Text -->
    <text x="133" y="225" class="col-title color-emerald">DEVELOPMENT</text>
    <text x="133" y="240" class="col-text col-highlight">Full-Stack Dev</text>
    <text x="133" y="253" class="col-text">JavaScript, React, Node</text>
  </g>

  <!-- COLUMN 5: DATA / AI (Blue) -->
  <g class="float-5">
    <!-- 3D Isometric Base Slab -->
    <path d="M 362 185 L 400 204 L 400 207 L 362 188 Z" fill="#1E3A8A" />
    <path d="M 400 204 L 438 185 L 438 188 L 400 207 Z" fill="#1D4ED8" />
    <path d="M 400 166 L 438 185 L 400 204 L 362 185 Z" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.2" />

    <!-- 3D Neural Nodes -->
    <g transform="translate(0, 126)">
      <line x1="400" y1="20" x2="393" y2="30" stroke="#93C5FD" stroke-width="1" />
      <line x1="400" y1="20" x2="407" y2="30" stroke="#93C5FD" stroke-width="1" />
      <line x1="393" y1="30" x2="407" y2="30" stroke="#93C5FD" stroke-width="1" stroke-dasharray="1.5,1.5" />
      <circle cx="400" cy="20" r="2.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="0.8" />
      <circle cx="393" cy="30" r="2.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="0.8" />
      <circle cx="407" cy="30" r="2.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="0.8" />
    </g>

    <!-- Text -->
    <text x="400" y="225" class="col-title color-blue">DATA / AI</text>
    <text x="400" y="240" class="col-text col-highlight">Python &amp; ML</text>
    <text x="400" y="253" class="col-text">NumPy, Pandas, Scikit</text>
  </g>

  <!-- COLUMN 6: LEADERSHIP (Orange) -->
  <g class="float-6">
    <!-- 3D Isometric Base Slab -->
    <path d="M 629 185 L 667 204 L 667 207 L 629 188 Z" fill="#7C2D12" />
    <path d="M 667 204 L 705 185 L 705 188 L 667 207 Z" fill="#9A3412" />
    <path d="M 667 166 L 705 185 L 667 204 L 629 185 Z" fill="rgba(249, 115, 22, 0.08)" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1.2" />

    <!-- 3D Gold Star -->
    <g transform="translate(667, 180)">
      <path d="M 0 -13 L 2.5 -5 L 9 -5 L 4.5 -1 L 6.5 6 L 0 2 L -6.5 6 L -4.5 -1 L -9 -5 L -2.5 -5 Z" fill="#F97316" stroke="#FFFFFF" stroke-width="0.8" />
      <circle cx="-1.5" cy="-2.5" r="0.8" fill="#FFFFFF" />
    </g>

    <!-- Text -->
    <text x="667" y="225" class="col-title color-orange">LEADERSHIP</text>
    <text x="667" y="240" class="col-text col-highlight">Project Ownership</text>
    <text x="667" y="253" class="col-text">Program Management</text>
  </g>
</svg>
