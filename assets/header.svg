<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700');

      /* Base styles */
      .bg {
        fill: #0B0F19;
      }
      .grid {
        fill: url(#grid-pattern);
      }

      /* Title typography */
      .title-shadow {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.05em;
        fill: #0F172A;
      }
      .title-main {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.05em;
        fill: url(#text-shine);
      }

      /* Tagline typography */
      .tagline {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.15em;
        fill: #E5B869; /* Premium gold instead of blue */
      }

      /* Role styles (typing/cycling) */
      .role {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.05em;
        fill: #94A3B8;
      }

      .role-val {
        fill: #FFFFFF;
      }

      .cursor {
        animation: blink 1s step-end infinite;
        fill: #E5B869; /* Gold cursor */
      }

      /* Each role has explicit initial visibility to prevent overrides conflict */
      .role-1 {
        animation: cycleRole1 24s infinite;
      }
      .role-2 { opacity: 0; animation: cycleRole2 24s infinite; }
      .role-3 { opacity: 0; animation: cycleRole3 24s infinite; }
      .role-4 { opacity: 0; animation: cycleRole4 24s infinite; }
      .role-5 { opacity: 0; animation: cycleRole5 24s infinite; }
      .role-6 { opacity: 0; animation: cycleRole6 24s infinite; }

      /* Floating animation for 3D plates */
      .plate-bottom {
        animation: floatPlateB 6s ease-in-out infinite;
      }
      .plate-middle {
        animation: floatPlateM 5s ease-in-out infinite;
      }
      .plate-top {
        animation: floatPlateT 4s ease-in-out infinite;
      }

      /* Floating animation for standalone 3D cubes */
      .cube-float-1 { animation: floatCube1 7s ease-in-out infinite; }
      .cube-float-2 { animation: floatCube2 5.5s ease-in-out infinite; }
      .cube-float-3 { animation: floatCube3 6.5s ease-in-out infinite; }

      /* Keyframes */
      @keyframes blink {
        50% { opacity: 0; }
      }

      @keyframes floatPlateB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes floatPlateM {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatPlateT {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes floatCube1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-2px, -8px); }
      }
      @keyframes floatCube2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(3px, -7px); }
      }
      @keyframes floatCube3 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-3px, -6px); }
      }

      /* Role cycling keyframes (6 roles, 24s total, 4s each) */
      @keyframes cycleRole1 {
        0%, 14% { opacity: 1; }
        16.6%, 97.4% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes cycleRole2 {
        0%, 14% { opacity: 0; }
        16.6%, 30.6% { opacity: 1; }
        33.2%, 100% { opacity: 0; }
      }
      @keyframes cycleRole3 {
        0%, 30.6% { opacity: 0; }
        33.2%, 47.2% { opacity: 1; }
        49.8%, 100% { opacity: 0; }
      }
      @keyframes cycleRole4 {
        0%, 47.2% { opacity: 0; }
        49.8%, 63.8% { opacity: 1; }
        66.4%, 100% { opacity: 0; }
      }
      @keyframes cycleRole5 {
        0%, 63.8% { opacity: 0; }
        66.4%, 80.4% { opacity: 1; }
        83%, 100% { opacity: 0; }
      }
      @keyframes cycleRole6 {
        0%, 80.4% { opacity: 0; }
        83%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>

    <!-- Isometric Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 20 M 0 0 L 40 20" fill="none" stroke="rgba(148, 163, 184, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Animated gold/silver shine sweep for the name -->
    <linearGradient id="text-shine" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E5B869" /> <!-- Gold shine -->
      <stop offset="65%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
      <animate attributeName="x1" from="-100%" to="100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" rx="12"/>
  <rect class="grid" width="100%" height="100%" rx="12"/>

  <!-- Left Typography Side -->
  <g>
    <!-- Title with 3D offset shadow and shine sweep -->
    <g class="title-group">
      <text class="title-shadow" x="57" y="107">MEET RABADIYA</text>
      <text class="title-main" x="55" y="105">MEET RABADIYA</text>
    </g>

    <!-- Tagline (Gold instead of blue) -->
    <g class="tagline-group">
      <text class="tagline" x="55" y="142">B.TECH ICT STUDENT • ADANI UNIVERSITY</text>
    </g>

    <!-- Dynamic typewriter role cycling -->
    <g class="role-group" transform="translate(55, 188)">
      <text class="role role-1" x="0" y="0">&gt; FOCUS: <tspan class="role-val">SOFTWARE_ENGINEER</tspan><tspan class="cursor">█</tspan></text>
      <text class="role role-2" x="0" y="0">&gt; FOCUS: <tspan class="role-val">FULL_STACK_DEVELOPER</tspan><tspan class="cursor">█</tspan></text>
      <text class="role role-3" x="0" y="0">&gt; FOCUS: <tspan class="role-val">UI_UX_DEVELOPER</tspan><tspan class="cursor">█</tspan></text>
      <text class="role role-4" x="0" y="0">&gt; FOCUS: <tspan class="role-val">PROMPT_ENGINEER</tspan><tspan class="cursor">█</tspan></text>
      <text class="role role-5" x="0" y="0">&gt; FOCUS: <tspan class="role-val">PROGRAM_MANAGER</tspan><tspan class="cursor">█</tspan></text>
      <text class="role role-6" x="0" y="0">&gt; FOCUS: <tspan class="role-val">LEADER</tspan><tspan class="cursor">█</tspan></text>
    </g>
  </g>

  <!-- Right 3D Scene Side -->
  <!-- We place elements inside animated groups that handle floating -->

  <!-- Standalone Floating 3D Cubes (Background layer) -->
  <g class="cube-float-1">
    <!-- Silver Cube -->
    <!-- Center: (520, 100) -->
    <path d="M 520 96 L 528 100 L 520 104 L 512 100 Z" fill="#E2E8F0" />
    <path d="M 512 100 L 520 104 L 520 112 L 512 108 Z" fill="#94A3B8" />
    <path d="M 520 104 L 528 100 L 528 108 L 520 112 Z" fill="#CBD5E1" />
  </g>

  <!-- 3D PLATE 1 (BOTTOM) -->
  <g class="plate-bottom">
    <!-- Side Wall Front-Left -->
    <path d="M 555.15 180 L 640 222.4 L 640 227.4 L 555.15 185 Z" fill="#0F172A" />
    <!-- Side Wall Front-Right -->
    <path d="M 640 222.4 L 724.85 180 L 724.85 185 L 640 227.4 Z" fill="#1E293B" />
    <!-- Top Face (Translucent Slate Glass) -->
    <g transform="translate(640, 180) scale(1, 0.5) rotate(45)">
      <rect x="-60" y="-60" width="120" height="120" rx="8" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1.5" />
      <!-- Grid Details inside plate -->
      <line x1="-60" y1="0" x2="60" y2="0" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />
      <line x1="0" y1="-60" x2="0" y2="60" stroke="rgba(148, 163, 184, 0.15)" stroke-width="1" />
      <!-- Small central circuit rect -->
      <rect x="-15" y="-15" width="30" height="30" rx="2" fill="none" stroke="rgba(229, 184, 105, 0.3)" stroke-width="1.5" />
    </g>
  </g>

  <!-- 3D PLATE 2 (MIDDLE) -->
  <g class="plate-middle">
    <!-- Side Wall Front-Left -->
    <path d="M 555.15 135 L 640 177.4 L 640 182.4 L 555.15 140 Z" fill="#111827" />
    <!-- Side Wall Front-Right -->
    <path d="M 640 177.4 L 724.85 135 L 724.85 140 L 640 182.4 Z" fill="#1F2937" />
    <!-- Top Face (Sleek Slate-Blue Glass) -->
    <g transform="translate(640, 135) scale(1, 0.5) rotate(45)">
      <rect x="-60" y="-60" width="120" height="120" rx="8" fill="rgba(17, 24, 39, 0.5)" stroke="rgba(229, 184, 105, 0.3)" stroke-width="1.5" />
      <!-- Concentric circles on middle plate -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="rgba(229, 184, 105, 0.2)" stroke-width="1" stroke-dasharray="8, 4" />
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(229, 184, 105, 0.35)" stroke-width="1" />
      <!-- Glowing core dot -->
      <circle cx="0" cy="0" r="5" fill="#E5B869" />
    </g>
  </g>

  <!-- 3D PLATE 3 (TOP) -->
  <g class="plate-top">
    <!-- Side Wall Front-Left -->
    <path d="M 555.15 90 L 640 132.4 L 640 137.4 L 555.15 95 Z" fill="#1E293B" />
    <!-- Side Wall Front-Right -->
    <path d="M 640 132.4 L 724.85 90 L 724.85 95 L 640 137.4 Z" fill="#334155" />
    <!-- Top Face (High-Contrast Frosted Glass) -->
    <g transform="translate(640, 90) scale(1, 0.5) rotate(45)">
      <rect x="-60" y="-60" width="120" height="120" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
      <!-- Brackets Code Icon on top plate (Projected isometrically) -->
      <g transform="scale(0.8)">
        <path d="M -18 -10 L -28 0 L -18 10 M 18 -10 L 28 0 L 18 10 M -4 14 L 4 -14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>

  <!-- Standalone Floating 3D Cubes (Foreground layer) -->
  <g class="cube-float-2">
    <!-- Gold Cube -->
    <!-- Center: (740, 150) -->
    <path d="M 740 146 L 748 150 L 740 154 L 732 150 Z" fill="#E5B869" />
    <path d="M 732 150 L 740 154 L 740 162 L 732 158 Z" fill="#C59E59" />
    <path d="M 740 154 L 748 150 L 748 158 L 740 162 Z" fill="#F3CE8A" />
  </g>

  <g class="cube-float-3">
    <!-- Slate Cube -->
    <!-- Center: (570, 210) -->
    <path d="M 570 206 L 578 210 L 570 214 L 562 210 Z" fill="#64748B" />
    <path d="M 562 210 L 570 214 L 570 222 L 562 218 Z" fill="#475569" />
    <path d="M 570 214 L 578 210 L 578 218 L 570 222 Z" fill="#94A3B8" />
  </g>
</svg>
